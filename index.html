<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MatCraft</title>
    <style>
        [page] { display: none; }
@import url('https://fonts.googleapis.com/css2?family=Unifont:wght@400&display=swap');


@font-face {
  font-family: 'mc';
  src: url('Minecraft-Regular.woff2') format('woff2'); 
  font-weight: normal;
  font-style: normal;
}

body {
  font-family: 'mc', 'Unifont', monospace;
    font-variant-emoji: text; 
}


    </style>
</head>
<body>

    <h1 page="test" class=mc>Test ☺☻♥♦♣♠№№℃©®℗℉™</h1>
    <script>
        const page = new URLSearchParams(window.location.search).get('page');
        document.querySelectorAll('[page]').forEach(el => {
            el.style.display = (!page || el.getAttribute('page') === page) ? 'block' : 'none';
        });
        const urlParams = new URLSearchParams(window.location.search);

if (!urlParams.has('page')) {
    const newUrl = new URL(window.location.href);
    newUrl.searchParams.set('page', 'home');
    window.history.replaceState({}, '', newUrl);
}

    </script>

</body>
</html>
